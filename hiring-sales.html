<!DOCTYPE html>
<html lang="en">
<head>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Hiring Process — Stand Up Recruitment</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

:root{
  --bg:#0a0a0a;
  --surface:#111111;
  --surface2:#181818;
  --surface3:#1f1f1f;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.12);
  --border3:rgba(255,255,255,0.18);
  --text:#f2ede5;
  --text2:#c8c4bc;
  --muted:#6e6a64;
  --accent:#c8f04a;
  --ready:#34d399;
  --dept-accent:#4ac8f0;
  --dept-accent-rgb:74,200,240;
  --font-head:'DM Serif Display',serif;
  --font-body:'Syne',sans-serif;
  --font-mono:'DM Mono',monospace;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --shadow-lg:0 2px 8px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.4);
  --transition:.18s ease;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.65;
  min-height:100vh;
}

#dashboard{max-width:880px;margin:0 auto;padding:64px 28px 100px}

.hero{margin-bottom:56px;position:relative}
.hero::before{
  content:'';
  position:absolute;
  top:-60px;left:-40px;right:-40px;
  height:340px;
  background:radial-gradient(ellipse 60% 50% at 30% 40%,rgba(var(--dept-accent-rgb),.08) 0%,transparent 70%);
  pointer-events:none;
  z-index:0;
}
.hero>*{position:relative;z-index:1}
.hero-eyebrow{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.18em;
  color:var(--dept-accent);
  text-transform:uppercase;
  margin-bottom:20px;
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.hero-eyebrow::before{
  content:'';
  display:inline-block;
  width:24px;height:1px;
  background:var(--dept-accent);
  opacity:.6;
}
.hero-title{
  font-family:var(--font-head);
  font-size:clamp(32px,5.5vw,50px);
  line-height:1.1;
  color:var(--text);
  margin-bottom:16px;
  letter-spacing:-.01em;
}
.hero-sub{
  font-size:15px;
  color:var(--muted);
  max-width:520px;
  line-height:1.75;
}

.module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.module-card{
  display:block;
  color:inherit;
  text-decoration:none;
  background:var(--surface);
  border:.5px solid var(--border);
  border-radius:var(--radius);
  padding:22px 22px 52px;
  cursor:pointer;
  transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition),background var(--transition);
  position:relative;
  overflow:hidden;
}
.module-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2.5px;
  opacity:0;
  transition:opacity var(--transition);
  background:linear-gradient(90deg,var(--dept-accent),transparent);
}
.module-card::after{
  content:'';
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity var(--transition);
  pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(var(--dept-accent-rgb),.06),transparent);
}
.module-card:hover{
  border-color:var(--border3);
  background:var(--surface2);
  transform:translateY(-3px);
  box-shadow:var(--shadow-lg),0 0 30px rgba(var(--dept-accent-rgb),.08);
}
.module-card:hover::before,.module-card:hover::after{opacity:1}
.module-num{
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.08em;
  margin-bottom:10px;
  color:var(--dept-accent);
  opacity:.85;
}
.module-title{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.35}
.module-desc{font-size:12px;color:var(--muted);line-height:1.6}
.module-arrow{
  position:absolute;
  bottom:18px;right:20px;
  font-size:18px;
  color:var(--border2);
  transition:color var(--transition),transform var(--transition);
}
.module-card:hover .module-arrow{color:var(--muted);transform:translateX(3px)}

.module-status{
  position:absolute;
  top:16px;right:16px;
  font-family:var(--font-mono);
  font-size:8.5px;
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:2px 8px;
  border-radius:10px;
}
.status-ready{background:rgba(52,211,153,.12);color:var(--ready);border:.5px solid rgba(52,211,153,.3)}
.status-soon{background:rgba(255,255,255,.06);color:var(--muted);border:.5px solid var(--border2)}

#module-view{display:none;max-width:780px;margin:0 auto;padding:44px 28px 100px}

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.06em;
  color:var(--muted);
  background:var(--surface);
  border:.5px solid var(--border2);
  border-radius:20px;
  padding:8px 16px;
  cursor:pointer;
  margin-bottom:40px;
  transition:color var(--transition),border-color var(--transition),background var(--transition);
}
.back-btn:hover{color:var(--text);border-color:var(--border3);background:var(--surface2)}

.empty-state{text-align:center;padding:56px 20px;border:1.5px dashed var(--border2);border-radius:var(--radius);background:var(--surface2)}
.empty-state .icon{font-size:30px;color:var(--dept-accent);margin-bottom:10px}
.empty-state h3{font-family:var(--font-head);font-size:20px;margin-bottom:8px;color:var(--text)}
.empty-state p{color:var(--muted);max-width:460px;margin:0 auto;font-size:13.5px;line-height:1.7}

#theme-toggle{
  position:fixed;
  top:20px;right:20px;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 16px;
  border-radius:20px;
  border:.5px solid var(--border2);
  background:rgba(17,17,17,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--muted);
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.08em;
  cursor:pointer;
  transition:all var(--transition);
  box-shadow:0 2px 12px rgba(0,0,0,.3);
  user-select:none;
}
#theme-toggle:hover{background:var(--surface2);color:var(--text);border-color:var(--border3)}
#theme-toggle .toggle-icon{font-size:13px;line-height:1}

#hub-back{
  position:fixed;
  top:20px;left:20px;
  z-index:1000;
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 16px;
  border-radius:20px;
  border:.5px solid var(--border2);
  background:rgba(17,17,17,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--muted);
  font-family:var(--font-mono);
  font-size:10px;
  letter-spacing:.08em;
  cursor:pointer;
  transition:all var(--transition);
  box-shadow:0 2px 12px rgba(0,0,0,.3);
  user-select:none;
  text-decoration:none;
}
#hub-back:hover{background:var(--surface2);color:var(--text);border-color:var(--border3)}
[data-theme="light"] #hub-back{background:rgba(255,255,255,.9)}

.status-partial{background:rgba(240,160,74,.12);color:#f0a04a;border:.5px solid rgba(240,160,74,.3)}

.module-header{background:linear-gradient(135deg,var(--surface) 0%,rgba(var(--dept-accent-rgb),.07) 100%);border:.5px solid var(--border2);border-radius:var(--radius);padding:32px 28px 26px;margin-bottom:28px}
.module-eyebrow{font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px;color:var(--dept-accent)}
.module-h1{font-family:var(--font-head);font-size:clamp(22px,4vw,30px);line-height:1.15;margin-bottom:10px;color:var(--text)}
.module-intro{font-size:14.5px;color:var(--muted);max-width:600px;line-height:1.7}

.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:10px;margin-bottom:18px;flex-wrap:wrap}
.tab-btn{padding:8px 14px;border-radius:7px;font-size:12px;font-weight:600;background:transparent;color:var(--muted);border:none;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--font-body)}
.tab-btn:hover{color:var(--text);background:var(--surface3)}
.tab-btn.active{background:var(--dept-accent);color:#000;box-shadow:0 1px 6px rgba(var(--dept-accent-rgb),.3)}
.tab-panel{display:none}
.tab-panel.active{display:block}

.topic-banner{display:flex;gap:12px;background:rgba(var(--dept-accent-rgb),.07);border:.5px solid rgba(var(--dept-accent-rgb),.22);border-radius:10px;padding:12px 16px;margin-bottom:16px}
.topic-banner .topic-tag{font-family:var(--font-mono);font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dept-accent);flex-shrink:0}
.topic-banner .topic-text{font-size:13.5px;color:var(--muted);line-height:1.55}

.content-block{background:var(--surface2);border:.5px solid var(--border2);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.block-label{display:inline-block;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dept-accent);background:rgba(var(--dept-accent-rgb),.1);border:.5px solid rgba(var(--dept-accent-rgb),.2);padding:3px 9px;border-radius:20px;margin-bottom:9px}
.block-title{font-size:16.5px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.3}
.block-body{font-size:13.5px;color:var(--muted);line-height:1.75}
.block-body strong{color:var(--text);font-weight:600}
.block-body ul,.block-body ol{padding-left:18px;margin-top:8px}
.block-body li{margin-bottom:6px;line-height:1.6}

.callout{border-radius:9px;padding:12px 16px;font-size:13px;line-height:1.65;border-left:3px solid var(--dept-accent);margin:10px 0;background:rgba(var(--dept-accent-rgb),.06);color:var(--muted)}
.callout .tag{font-family:var(--font-mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px;color:var(--dept-accent)}
.callout.warn{background:rgba(240,160,74,.1);border-color:#f0a04a}
.callout.warn .tag{color:#f0a04a}
.callout.success{background:rgba(52,211,153,.1);border-color:var(--ready)}
.callout.success .tag{color:var(--ready)}
.callout strong{color:var(--text)}

.formula{background:rgba(var(--dept-accent-rgb),.06);border:.5px solid rgba(var(--dept-accent-rgb),.18);border-left:3px solid var(--dept-accent);border-radius:0 8px 8px 0;padding:13px 16px;font-size:13px;color:var(--muted);line-height:1.7;font-style:italic;margin:10px 0}
.formula strong{color:var(--text);font-style:normal}

.step-row{display:flex;gap:12px;align-items:flex-start;padding:9px 14px;background:var(--surface3);border:.5px solid var(--border2);border-radius:8px;margin-bottom:6px}
.step-num{width:24px;height:24px;min-width:24px;border-radius:50%;background:var(--dept-accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--font-mono)}
.step-body{font-size:13.5px;color:var(--muted);line-height:1.6}
.step-body strong{color:var(--text)}
.step-meta{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:3px}

.data-table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0;border-radius:8px;overflow:hidden}
.data-table thead tr{background:rgba(var(--dept-accent-rgb),.08)}
.data-table th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:9px 12px;text-align:left;border-bottom:.5px solid var(--border2);font-family:var(--font-mono)}
.data-table td{font-size:13px;padding:9px 12px;border-bottom:.5px solid var(--border);vertical-align:top;color:var(--muted)}
.data-table td strong{color:var(--text)}
.data-table tr:last-child td{border-bottom:none}

.email-template{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.email-template-header{padding:14px 18px;border-bottom:.5px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--surface3)}
.email-template-label{font-family:var(--font-mono);font-size:9px;color:var(--dept-accent);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.email-template-subject{font-size:12.5px;color:var(--muted);line-height:1.4}
.email-template-body{padding:18px;font-size:13px;color:var(--muted);line-height:1.85;white-space:pre-wrap;font-family:var(--font-body)}
.copy-btn{font-family:var(--font-mono);font-size:9px;letter-spacing:.06em;color:var(--muted);border:.5px solid var(--border2);border-radius:20px;padding:5px 12px;cursor:pointer;background:transparent;flex-shrink:0}
.copy-btn:hover{color:var(--dept-accent);border-color:var(--dept-accent)}

@media(max-width:640px){
  #dashboard{padding:48px 18px 80px}
  #module-view{padding:32px 18px 80px}
  .module-grid{grid-template-columns:1fr}
}

[data-theme="light"]{
  --bg:#f4f2ee;
  --surface:#ffffff;
  --surface2:#edeae5;
  --surface3:#e5e2dc;
  --border:rgba(0,0,0,0.07);
  --border2:rgba(0,0,0,0.13);
  --border3:rgba(0,0,0,0.22);
  --text:#18160f;
  --text2:#4a4641;
  --muted:#7a756e;
  --accent:#4a6600;
  --ready:#059669;
  --dept-accent:#0284c7;
  --dept-accent-rgb:2,132,199;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 2px 8px rgba(0,0,0,.1),0 12px 40px rgba(0,0,0,.08);
}
[data-theme="light"] body{background:var(--bg)}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15)}
[data-theme="light"] ::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25)}
[data-theme="light"] .module-card{box-shadow:0 1px 4px rgba(0,0,0,.06)}
[data-theme="light"] #theme-toggle{background:rgba(255,255,255,.9)}
[data-theme="light"] .status-soon{background:rgba(0,0,0,.04)}
</style>

<body>
<a id="hub-back" href="admin-ops-hub.html" title="Back to Admin &amp; Ops Hub">
  <span class="toggle-icon">&#8592;</span>
  <span>Hub</span>
</a>
<button id="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode">
  <span class="toggle-icon" id="toggle-icon">&#9728;&#65039;</span>
  <span id="toggle-label">Light</span>
</button>

<div id="module-view" style="display:block">
  <button class="back-btn" onclick="location.href='admin-ops-hub.html'">&#8592; Back to Hiring Process</button>
  <div id="hiring-sales-content"></div>
</div>

<script>
/* ============================================================
   HIRING PROCESS CONTENT (shared framework, adapted from the
   org-wide reference design)
   ============================================================ */
function hiringOverviewTab(deptName){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">The full hiring journey at a glance &mdash; from sourcing the role through to the final decision.</span></div>
  <div class="content-block">
    <div class="block-label">Process at a Glance</div>
    <div class="block-title">Sourcing, then a five-stage hiring framework</div>
    <div class="step-row"><div class="step-num">0</div><div class="step-body"><strong>Sourcing &amp; Requisition</strong> &mdash; need identified, job card raised, adverts posted, applications land in JobAdder. See the Sourcing tab.</div></div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body"><strong>Screening Call</strong> &mdash; 5-10 min phone filter, decides who comes in for an interview.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body"><strong>In-Person Interview</strong> &mdash; 30 min structured interview, decides who gets the test project.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body"><strong>Reference Check</strong> &mdash; two reference checks on the candidate.</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body"><strong>Test Project</strong> &mdash; hands-on, observable, Yes/No scoring. Placeholder &mdash; pending confirmation with the ${deptName} lead.</div></div>
    <div class="step-row"><div class="step-num">5</div><div class="step-body"><strong>Final Hiring Decision</strong> &mdash; made with input from everyone who ran a stage.</div></div>
  </div>
  <div class="callout"><span class="tag">Templates</span>Every candidate-facing message for this process &mdash; SMS and email &mdash; is ready to copy in the <strong>Templates</strong> tab.</div>
  <div class="callout warn"><span class="tag">Placeholder</span>Stages 1, 2, 3 and 5 below are the shared framework used across Stand Up Recruitment. <strong>Stage 4 (Test Project)</strong> is still a placeholder for ${deptName}, pending confirmation with the department lead &mdash; see that tab for details.</div>
  `;
}

function hiringSourcingTab(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">How a role gets opened, advertised, and starts pulling in applications &mdash; everything before the first call.</span></div>
  <div class="content-block">
    <div class="block-label">Before Stage 1</div>
    <div class="block-title">Sourcing &amp; Requisition</div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body"><strong>Need identified</strong> &mdash; department lead flags an open position.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body"><strong>Job card created in JobAdder</strong>.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body"><strong>Adverts posted</strong> via JobAdder to Seek, TradeMe, and the company website; social media content used if extra reach is needed.</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body"><strong>All applications/resumes land in JobAdder</strong>.</div></div>
  </div>
  <div class="callout"><span class="tag">Handoff</span>Once applications are landing in JobAdder, move into Stage 1 &mdash; Screening Call.</div>
  `;
}

function hiringStage1Tab(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">The phone screening call &mdash; a fast, low-stakes filter that decides who's worth bringing in for an interview.</span></div>
  <div class="content-block">
    <div class="block-label">Purpose &amp; Format</div>
    <div class="block-body">
      <p><strong>Purpose:</strong> low-stakes filter only. This call isn't deciding a hire &mdash; it's deciding whether to bring them in for an in-person interview. If they sound clearly bad on the phone, don't bring them in. If they pass, move to in-person.</p>
      <p><strong>Length:</strong> 5-10 minutes. Keep it short &mdash; you are not selling yet, this is a filter, not a pitch.</p>
      <p><strong>Who runs it:</strong> department lead or the person responsible for internal hiring.</p>
    </div>
  </div>
  <div class="content-block">
    <div class="block-label">Opener</div>
    <div class="formula">"Hi, is this [Name]? You applied here at Stand Up Recruitment for the [role] role &mdash; have you got a quick five minutes to talk?"</div>
    <div class="block-body"><p><strong>Training note:</strong> They applied, so this isn't a cold call &mdash; don't over-explain who you are or what Stand Up does yet. Confirm identity, confirm the role, ask for the five minutes, then move straight into Q1.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Screening Questions</div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body"><strong>Why are you looking for a new role right now?</strong><br>Training note: this goes first every time. You're listening for a genuine, specific reason vs something vague or evasive.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body"><strong>What hours can you work or are you looking for fulltime work?</strong><br>Training note: non-negotiable filter. If it doesn't match what the role needs, end the process here.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body"><strong>Where do you live?</strong><br>Training note: distance is a reliability filter &mdash; too far to realistically commute means it's not going to work.</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body"><strong>What's your minimum required income?</strong><br>Training note: don't skip this. Ask plainly so you're not wasting time later.</div></div>
  </div>
  <div class="content-block">
    <div class="block-label">Scoring the Call</div>
    <table class="data-table">
      <thead><tr><th>Signal</th><th>Pass</th><th>Fail</th></tr></thead>
      <tbody>
        <tr><td><strong>Energy / tone</strong></td><td>Present, engaged, sounds like they want to be there</td><td>Flat, monotone, sounds checked out</td></tr>
        <tr><td><strong>Listening</strong></td><td>Answers the actual question asked</td><td>Rambles, pitches themselves, ignores the question</td></tr>
        <tr><td><strong>Conversation flow</strong></td><td>Can hold a back-and-forth naturally</td><td>You're doing all the work to keep it moving</td></tr>
        <tr><td><strong>Directness</strong></td><td>Gives real, specific answers</td><td>Hedges, vague, non-answers</td></tr>
      </tbody>
    </table>
  </div>
  <div class="content-block">
    <div class="block-label">Close &amp; Decision</div>
    <div class="formula">"Appreciate it &mdash; I'll be in touch within [X days] either way."</div>
    <div class="block-body"><p><strong>Good candidate &mdash; lock in an interview, on this call:</strong></p></div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body">Ask when he/she can come in for an interview.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body">Check your own calendar for availability.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body">Check the department lead's calendar for availability.</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body">Confirm the time with the candidate over the phone, before you hang up.</div></div>

  </div>
  `;
}

function hiringStage1TabRecruitment(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">The phone screening call &mdash; a fast, low-stakes filter that decides who's worth bringing in for an interview.</span></div>
  <div class="content-block">
    <div class="block-label">Purpose &amp; Format</div>
    <div class="block-body">
      <p><strong>Purpose:</strong> low-stakes filter only. This call isn't deciding a hire &mdash; it's deciding whether to bring them in for an in-person interview. If they sound clearly bad on the phone, don't bring them in. If they pass, move to in-person.</p>
      <p><strong>Length:</strong> 5-10 minutes. Keep it short &mdash; you are not selling yet, this is a filter, not a pitch.</p>
      <p><strong>Who runs it:</strong> department lead or the person responsible for internal hiring.</p>
    </div>
  </div>
  <div class="content-block">
    <div class="block-label">Opener</div>
    <div class="formula">"Hi, is this [Name]? You applied here at Stand Up Recruitment for the [role] role &mdash; have you got a quick five minutes to talk?"</div>
    <div class="block-body"><p><strong>Training note:</strong> They applied, so this isn't a cold call &mdash; don't over-explain who you are or what Stand Up does yet. Confirm identity, confirm the role, ask for the five minutes, then move straight into Q1.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Screening Questions</div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body"><strong>Why are you looking for a new role right now?</strong><br>Training note: this goes first every time. You're listening for a genuine, specific reason vs something vague or evasive. Leaving a bad situation is fine &mdash; dodging the question or badmouthing every past employer is the flag.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body"><strong>Are you looking for a full-time role?</strong><br>Training note: non-negotiable filter for this role. Part-time or casual only &mdash; end the process here, don't carry a scheduling mismatch into later stages.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body"><strong>Where do you live?</strong> <em>(only ask if it isn't already on their CV)</em><br>Training note: a reliability filter &mdash; too far to realistically commute means it's not going to work regardless of how good they are elsewhere.</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body"><strong>Are you a NZ citizen?</strong> <em>(only ask if not already clear)</em> &mdash; if not, what visa category are you on?<br>Training note: don't ask a NZ citizen about visa status, it's not relevant. If on a visa or new to the country, the category (work / resident / student) affects how soon they can start and whether the role is even open to them.</div></div>
    <div class="step-row"><div class="step-num">5</div><div class="step-body"><strong>What are you looking to earn &mdash; and what's the minimum that would make the move worthwhile?</strong><br>Training note: don't skip this. Ask it plainly: "so we're not wasting time later &mdash; what's the minimum you'd need for this role?" If it's outside budget, better to know now.</div></div>
    <div class="step-row"><div class="step-num">6</div><div class="step-body"><strong>What's your notice period &mdash; and realistically, how soon could you start if this moves forward?</strong><br>Training note: a notice period that doesn't line up with when we need someone is a genuine constraint &mdash; flag it, don't ignore it because everything else sounds good.</div></div>
    <div class="step-row"><div class="step-num">7</div><div class="step-body"><strong>Tell me about a time something didn't go your way at work &mdash; what did you do next?</strong><br>Training note: your grit/attitude read. Listen for ownership and action, not blame. "That's just how it was" with no next step is a flag; "I changed my approach / asked for help / kept going" is what you want.</div></div>
  </div>
  <div class="content-block">
    <div class="block-label">Scoring the Call</div>
    <table class="data-table">
      <thead><tr><th>Signal</th><th>Pass</th><th>Fail</th></tr></thead>
      <tbody>
        <tr><td><strong>Energy / tone</strong></td><td>Present, engaged, sounds like they want to be there</td><td>Flat, monotone, sounds checked out</td></tr>
        <tr><td><strong>Listening</strong></td><td>Answers the actual question asked</td><td>Rambles, pitches themselves, ignores the question</td></tr>
        <tr><td><strong>Conversation flow</strong></td><td>Can hold a back-and-forth naturally</td><td>You're doing all the work to keep it moving</td></tr>
        <tr><td><strong>Directness</strong></td><td>Gives real, specific answers</td><td>Hedges, vague, non-answers</td></tr>
      </tbody>
    </table>
  </div>
  <div class="content-block">
    <div class="block-label">Close</div>
    <div class="formula">"Look, based on our chat I'd love to get you in for a quick in-person interview &mdash; have you got some time this week? Would [Day, Time] or [Day, Time] work for you?"</div>
    <div class="formula">If you need more time to decide: "Appreciate it &mdash; I'll be in touch within [X days] either way."</div>
    <div class="block-body"><p>Training note: if you're locking in a time, get the day and time confirmed before you hang up, then send the Interview Confirmation email as a calendar invite so it lands in their diary, not just their inbox. If you're not ready to commit yet, no hype, no over-promising &mdash; keep the fallback line flat and professional.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Decision</div>
    <div class="step-row"><div class="step-num">&#10003;</div><div class="step-body"><strong>Sounds good, strong energy &amp; communication</strong> &mdash; lock in an interview time on the call, then send the Interview Confirmation email as a calendar invite.</div></div>
    <div class="step-row"><div class="step-num">&#10005;</div><div class="step-body"><strong>Sounds clearly bad</strong> &mdash; decline, note reason on file. No email required.</div></div>
  </div>
  `;
}

function hiringStage2TabRecruitment(){
  const sections = [
    ["Icebreaker &amp; Getting to Know Them","5 min",`"Before we get into anything &mdash; just tell me about yourself. Not your CV, just you. What are you about?"<br>What does life outside of work look like at the moment &mdash; who's in your corner, family, flatmates, whoever keeps you grounded?<br>"What attracted you to apply at Stand Up Recruitment?"`,"Follow their energy here. If they light up talking about a partner, kids, a parent, a sport, or a mate, stay there an extra beat and ask one genuine follow-up before moving on. This is about understanding who they are and what's grounding them, not assessing their personal circumstances &mdash; a short answer is a fine answer."],
    ["Hunger &amp; Competitiveness","4 min",`"What's something you've worked really hard to get good at &mdash; and what drove you to keep going?"<br>"Tell me about a time you had to put in serious extra hours or effort to hit something that mattered &mdash; what did that actually look like, and how did you feel about it afterward?"`,""],
    ["Overcoming Challenges","4 min",`"What's the biggest challenge you've had to work through &mdash; whether in your studies, work, or life in general? How did you approach it?"`,""],
    ["Handling Feedback","4 min",`"Tell me about a time someone gave you tough feedback, or pulled you up on something you got wrong. What did they say, and what did you do with it?"`,"You're testing for a can-do reaction to being corrected, not perfection in the story. Defensiveness or blame-shifting here is a real flag &mdash; this role will involve regular feedback."],
    ["Team &amp; Resilience Background","4 min",`"Have you ever been part of a team &mdash; sport, work, community, anything &mdash; where you had to push through something hard together? Tell me about it and what it taught you about yourself."`,""],
    ["Role-Relevant Scenario","4 min",`Live scenario, run by the Recruitment Team Lead &mdash; see Appendix A in the Templates tab. Confirmed for Recruitment: "Pretend I'm a candidate who's not interested &mdash; convince me." Push back once or twice.`,"Zero role-specific experience required &mdash; this is testing raw thinking and composure under a bit of pressure, not industry knowledge."],
    ["About Us &amp; The Role","1 min","","Sell the company here, after testing &mdash; not before. Selling first risks candidates shaping earlier answers to match what they've just heard you're excited about."],
    ["Closing","2 min",`"Is there anything about you that we wouldn't know from your CV &mdash; something you want us to know before we wrap up?"<br>"What questions do you have for us?"<br>Just a practical one before we wrap up &mdash; what's your notice period at the moment, and realistically, how soon could you start if this moves forward?`,""],
    ["Next Steps","2 min",`"Before you go, here's what happens next on our end: if we'd like to move forward, we run a criminal record check, two reference checks, and two independent checks &mdash; that's standard for every hire. If you haven't already sent through two referees, could you flag your two most recent supervisors for us?"`,"If they haven't provided referees yet, get two now &mdash; ideally direct supervisors from their two most recent roles. If you don't already have what you need for the criminal record check (full name, date of birth, residential address, driving licence number), ask for it here rather than chasing it later by email. Strong candidate &mdash; lock in the test-project date before they leave. Clear no &mdash; let them go warmly; a clean, kind close beats a vague 'we'll be in touch.'"]

  <div class="callout"><span class="tag">Training note</span>Run it like a conversation, not an interrogation. Let the candidate talk more than you do, let silences sit instead of rushing to fill them, and when something real comes up &mdash; a name, a hobby, a frustration, a throwaway comment &mdash; stay on it a beat longer before moving to the next line. That's usually where the more honest, less rehearsed answers come from.</div>

  <div class="content-block">

        <tr><td>Mindset &amp; Attitude</td><td></td><td></td></tr>
        <tr><td>Hunger &amp; Competitiveness</td><td></td><td></td></tr>
        <tr><td>Communication &amp; People Skills</td><td></td><td></td></tr>
        <tr><td>Handling Feedback</td><td></td><td></td></tr>
        <tr><td>Team &amp; Resilience Background</td><td></td><td></td></tr>
        <tr><td>Role-Relevant Thinking</td><td></td><td></td></tr>
        <tr><td>Overall Impression</td><td></td><td></td></tr>

    <div class="block-body" style="margin-top:10px">

function hiringStage3TabRecruitment(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">Standard due diligence before we invest the team's time in a live test project. 2&ndash;5 business days, owned by Nihanga. Every candidate who passes Stage 2 goes through all five checks below &mdash; no exceptions, no shortcuts for a candidate who "seems great."</span></div>
  <div class="content-block">
    <div class="block-label">Check 1 &mdash; Criminal Record Check</div>
    <div class="block-body"><p>Requested through the Ministry of Justice Criminal Record Check service once the candidate has given written consent (see the Checks Consent Request email in Templates). The candidate applies online or via the paper form; results are typically returned within a few working days.</p></div>
    <div class="callout"><span class="tag">Training note</span>A conviction on record isn't an automatic decline &mdash; read it in context (what, how long ago, how relevant to the role) and discuss with Les before deciding either way. We're screening for undisclosed risk, not making moral judgements on someone's past.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Checks 2 &amp; 3 &mdash; Reference Checks (x2)</div>
    <div class="block-body"><p>Minimum two, both from supervisors the candidate provided at Stage 2. Do not call one referee and wait to hear back &mdash; batch your calls and work through the list efficiently.</p></div>
    <table class="data-table">
      <thead><tr><th>Time</th><th>Action</th></tr></thead>
      <tbody>
        <tr><td>Morning</td><td>Call all referees on your list</td></tr>
        <tr><td>Afternoon</td><td>Recall anyone who did not answer in the morning</td></tr>
        <tr><td>After 2nd no answer</td><td>Send the reference no-answer SMS (see Templates) and wait for a reply</td></tr>
      </tbody>
    </table>
  </div>
  <div class="content-block">
    <div class="block-label">The Reference Check Call Script</div>
    <div class="block-body"><p>Keep it casual &mdash; you want the referee to open up naturally, not feel like they're being formally interviewed.</p></div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body"><strong>Open</strong> &mdash; own the familiarity. Say their name first, confident, not a question.<div class="formula" style="margin-top:6px">"[Referee First Name]." (They respond) "Hey, it's [Your Name] &mdash; [Candidate Full Name] gave me your number, said it's okay to run a bit of a reference check."</div>If they want context or two minutes &mdash; answer plainly and keep moving. Don't over-explain.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body"><strong>The rundown</strong> &mdash; the most important part. Ask it open, then stop talking. Let them run.<div class="formula" style="margin-top:6px">"Can you give me a full rundown please &mdash; the good, the bad, and the ugly?"</div>Listen for: attitude (on the tools, with the team, under pressure), attendance (reliable, punctual, red flags), and anything volunteered unprompted &mdash; usually the most honest signal. If short or vague, try: "Yeah? What was that like day to day?"</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body"><strong>Skills and experience</strong> &mdash; get specific to the role, don't accept a general answer. "What kind of work was he actually doing for you?" "Was he good at it?" "Any muck-ups or mistakes worth mentioning?" Push once if the answer is too smooth: "Genuinely no issues at all?"</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body"><strong>If they're hesitant</strong> &mdash; if they seem cagey or want to loop in HR, don't push. Respect it and note it as a flag: "No worries at all &mdash; appreciate you letting me know. If you think of anything after we hang up, feel free to flag it."</div></div>
    <div class="step-row"><div class="step-num">5</div><div class="step-body"><strong>The close</strong> &mdash; force the real answer. Say it slow, let the cost of a bad hire land before the ask.<div class="formula" style="margin-top:6px">"Look [Name], I'm sure you've made bad hires before and know how much it can cost in lost time and money. That's all I'm trying to avoid here. With that in mind, do you think [Candidate Full Name] would be a good addition to my company?"</div>Whatever they say next &mdash; silence, hesitation, a flat yes &mdash; that's your answer. Don't fill the silence.</div></div>
  </div>
  <div class="content-block">
    <div class="block-label">Handling Red Flags and Lukewarm Responses</div>
    <table class="data-table">
      <thead><tr><th>Outcome</th><th>What to Do</th></tr></thead>
      <tbody>
        <tr><td>1 red flag or lukewarm response</td><td>Ask the candidate for an additional referee &mdash; don't tell them why</td></tr>
        <tr><td>2 or more red flags out of 3</td><td>Do not progress. Inform the candidate we will not be moving forward</td></tr>
        <tr><td>All clear</td><td>Proceed to independent checks below</td></tr>
      </tbody>
    </table>
  </div>
  <div class="content-block">
    <div class="block-label">Checks 4 &amp; 5 &mdash; Independent Checks (x2)</div>
    <div class="block-body"><p>Two further, informal checks with people who worked alongside the candidate but weren't nominated by them as referees. The referees a candidate gives you are usually their strongest supporters &mdash; friendly, positive, naturally biased in their favour. An independent check gets you an honest, unprimed reaction instead: the person you reach isn't expecting your call and hasn't been coached on what to say.</p></div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body">Go through the candidate's CV and identify their two most recent employers, excluding whichever companies their own referees came from. Search for the company's phone number online and call the general line &mdash; don't use a number the candidate has given you.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body">Ask reception (or whoever answers) to put you through to someone who can speak to the candidate's time there &mdash; ideally a supervisor, team lead, or manager. A colleague who worked alongside them is fine too.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body">If nobody currently there remembers them, ask if anyone still on staff was working during that period. If you can't get anyone useful, move to the next most recent employer and repeat &mdash; keep working down the list until you land two independent checks with someone who actually worked with the candidate.</div></div>
    <div class="callout"><span class="tag">Training note</span>Use the same call script as the nominated reference checks above &mdash; the goal is the same honest rundown, just from someone the candidate didn't hand-pick. Be professional and discreet; you're checking someone's work history, not gossiping about them.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Stage 3 Checklist</div>
    <table class="data-table">
      <thead><tr><th>Check</th><th>Result</th></tr></thead>
      <tbody>
        <tr><td>Criminal record check requested &mdash; cleared, or flagged item discussed with Les</td><td>Clear / Discuss</td></tr>
        <tr><td>Reference 1 completed &mdash; no concerns raised</td><td>Clear / Discuss</td></tr>
        <tr><td>Reference 2 completed &mdash; no concerns raised</td><td>Clear / Discuss</td></tr>
        <tr><td>Independent check 1 completed &mdash; no concerns raised</td><td>Clear / Discuss</td></tr>
        <tr><td>Independent check 2 completed &mdash; no concerns raised</td><td>Clear / Discuss</td></tr>
      </tbody>
    </table>
    <div class="block-body" style="margin-top:10px"><p><strong>Rule:</strong> all five Clear = proceed to Stage 4. Any Discuss = talk it through with Les before booking the test project &mdash; don't default to decline, and don't default to progress either.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Decision</div>
    <ul>
      <li><strong>All clear</strong> &mdash; send "Selected for Project" email, book Stage 4: test project</li>
      <li><strong>Concern raised</strong> &mdash; discuss with Les before proceeding; if not proceeding, send "Rejected &mdash; After Checks" email</li>
    </ul>
  </div>
  `;
}

function hiringStage5TabRecruitment(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">The final call &mdash; deciding to hire or not, sharing the career ladder, and what happens next for the candidate.</span></div>
  <div class="content-block">
    <div class="block-label">Final Hiring Decision</div>

  `;

function hiringSourcingTabSales(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">Who you're fishing for, before you write the ad &mdash; this isn't "someone with sales experience," CVs don't tell you what actually matters. What matters is temperament, and you can only test for it live.</span></div>
  <div class="content-block">
    <div class="block-label">The Avatar &mdash; What Good Looks Like</div>
    <div class="block-body"><ul>
      <li><strong>Comfortable with rejection and confrontation</strong> &mdash; pushes back on a customer without flinching, doesn't need to be liked.</li>
      <li><strong>Money-motivated over security-motivated</strong> &mdash; genuinely wants low base / high commission, not just tolerating it.</li>
      <li><strong>Talks fast and thinks on their feet</strong> &mdash; shows up in the first 10 seconds of the phone screen, and again in the live cold-call test.</li>
      <li><strong>Coachable ego</strong> &mdash; takes on-the-spot feedback as information, not an attack. A rough performance with a coachable reaction beats a smooth performance with a defensive one. You can train skill. You can't train ego.</li>
      <li><strong>Has sold something in-person and high-pressure before</strong> &mdash; see the CV-screening reference below for exactly which backgrounds count. A customer-service background usually doesn't transfer &mdash; too used to being liked, not used to pushing.</li>
      <li><strong>Demonstrated experience holding their own in high-stakes, adult conversations</strong> &mdash; real proof they've been tested in a conversation where someone could say no to them, before this role, not on it. The buyer here is a busy, often blunt construction business owner who won't make allowances for nerves.</li>
    </ul></div>
  </div>
  <div class="content-block">
    <div class="block-label">CV-Screening Reference &mdash; Which Sales Backgrounds Actually Count</div>
    <div class="block-body"><p>The through-line is "no hiding." A background where rejection happens to someone's face, in real time, with no script to retreat behind, is worth far more than one where the customer walked up already interested.</p></div>
    <table class="data-table">
      <thead><tr><th>Signal Strength</th><th>Backgrounds</th><th>Why</th></tr></thead>
      <tbody>
        <tr><td><strong>Tier 1 &mdash; Strongest</strong></td><td>Door-to-door sales (any product); pest control sales; solar sales; in-home sales (alarm systems, Cutco-style); direct field sales</td><td>Cold, in-person, no hiding. Rejection happens to their face, in real time, with no script to retreat behind.</td></tr>
        <tr><td><strong>Tier 2 &mdash; Strong</strong></td><td>Car sales (lot sales, not internet leads); retail commission sales (working a floor &mdash; furniture, mattresses, electronics)</td><td>Still in-person and commission-driven, but the customer usually walked in already somewhat interested.</td></tr>
        <tr><td><strong>Tier 3 &mdash; Weaker, still worth a look</strong></td><td>Street fundraising</td><td>Good rejection tolerance, but usually scripted and low-stakes financially &mdash; doesn't test price-holding the same way.</td></tr>
        <tr><td><strong>Doesn't count</strong></td><td>Trade show / expo booth sales</td><td>People walk up already curious. No cold approach, no real "no" to overcome.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="content-block">
    <div class="block-label">Traits vs. Experience &mdash; The Call We're Making</div>
    <div class="block-body"><p>The Sales Team Training Manual (Hormozi Method) says the opposite of what's above &mdash; "Hire for traits, not experience. Experience does not predict success," listing work ethic, coachability, competitiveness, emotional resilience and hunger for success as what actually matters. That's a legitimate position.</p>
    <p style="margin-top:8px">The decision for this role: traits remain the primary filter, but a real-world experience floor is added on top of them &mdash; because the audience (construction business owners, cold, on the phone or in person) is less forgiving than a warmer B2C sale.</p></div>
    <div class="callout warn"><span class="tag">Training note</span>This is deliberately framed as "proven experience in high-stakes adult conversations," not an age cut-off &mdash; an age-based bar creates legal risk (age discrimination) without actually testing the thing that matters. Someone young with real experience holding their own passes; someone older with none doesn't.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Where to Actually Find That Person</div>
    <div class="block-body"><p>Job boards alone tend to surface generic applicants. Worth looking sideways at people already in commission-only or high-churn sales roles who are underpaid relative to their skill &mdash; real estate agents in a slow patch, car salespeople, insurance/mortgage brokers. They already have the temperament and are often looking for a better commission structure.</p></div>
    <div class="callout"><span class="tag">Best channel</span>A direct LinkedIn message tends to work better than a passive ad for this group.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Disqualifiers</div>
    <div class="block-body"><ul>
      <li>Needs reassurance before acting</li>
      <li>Gets defensive on feedback</li>
      <li>Talks slowly or flatly on the phone screen</li>
      <li>Can't explain why they want a sales role beyond "needed a job"</li>
    </ul></div>
  </div>
  <div class="content-block">
    <div class="block-label">Advertise the Role</div>
    <div class="block-body"><p>Post on all major job boards &mdash; Seek, TradeMe, LinkedIn. Keep the ad structured around commission-heavy, high-reward earning potential &mdash; low base, high commission &mdash; since that's the actual structure of the role, and it naturally filters toward people comfortable with performance-based pay.</p></div>
    <div class="callout warn"><span class="tag">Not locked yet</span>Ad copy itself isn't locked yet &mdash; flag separately if a polished version needs to be written up.</div>
  </div>
  `;
}

function hiringStage2TabSales(){
  const sections = [
    ["Warm-Up (Not CV, Just Them)","",`"Before we get into anything &mdash; just tell me about yourself. Not your CV, just you. What are you about?"<br>"What attracted you to apply for this role specifically?"`,""],
    ["Sales Background","",`"What have you sold before, and how did that actually work &mdash; were you generating your own leads, or working off leads someone handed you?"<br>"Walk me through a sale you're genuinely proud of. What made it hard, and what did you do?"<br>"Tell me about a time a customer or prospect pushed back hard on price. What did you actually say?"`,"testing real experience vs. a rehearsed answer &mdash; listen for specifics, not general impressions."],
    ["Pressure &amp; Resilience","",`"Tell me about the worst rejection you've had in a sales or customer-facing role. How did you handle it in the moment, and how did you feel an hour later?"<br>"What's something you've worked hard to get good at, and what actually drove you to keep going when it wasn't clicking?"<br>"Have you ever been part of a team &mdash; sport, work, anything &mdash; where you had to push through something hard together? What did it teach you?"`,"testing whether setbacks bounce off them or stick. Listen for ownership vs. blame."],
    ["Money &amp; Motivation","",`"This role is base plus uncapped commission. How do you actually feel about that &mdash; not just 'yeah that's fine'?"<br>"If you joined us and your first month was rough &mdash; not clicking yet &mdash; what would you do?"`,""],
    ["Persuasion","",`"Tell me about a time you had to persuade someone who genuinely didn't want to listen. What did you say, and how did it go?"`,""],
    ["About Us &amp; The Role","",`"So let me tell you what we actually do here. Stand Up Recruitment places New Zealand tradies with construction business owners across Australia who are desperate for good workers and can't find them. We're not another agency cold-calling into the void &mdash; we send a video pitch ahead of every call, so by the time someone's actually talking to a business owner, that owner already knows who we are and what we do. Your job is to run that conversation and get the deal signed."<br><br>"This isn't sink-or-swim. You get real training &mdash; daily coaching, live call reviews, role-plays with real objections &mdash; and a genuine path to grow, both in what you earn and in your title, as you prove yourself."<br><br>"It's base salary plus uncapped commission, so there's a real, ceiling-free upside here for someone who's good at this. The only limit is how good you get."`,"this is you selling it to them, not just informing them &mdash; sell the role here, after testing."],
    ["Their Questions","",`"What questions do you have for us?"`,""]
  ];
  let stepsHtml = sections.map((s,i) => `
    <div class="step-row">
      <div class="step-num">${i+1}</div>
      <div class="step-body">
        <strong>${s[0]}</strong>
        ${s[2] ? `<div class="formula" style="margin:8px 0 4px">${s[2]}</div>` : ""}
        ${s[3] ? `<div style="margin-top:4px">Training note: ${s[3]}</div>` : ""}
      </div>
    </div>
  `).join("");
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">This replaces sending them a script and running a scripted roleplay. At this stage they have none of your internal material &mdash; no script, no objection sheet, nothing. You're testing raw, uncoached ability: what they walk in with, not what they can be taught.</span></div>
  <div class="content-block">
    <div class="block-label">Part A &mdash; The Interview</div>
    <div class="block-body"><p>Sit down (in person or on video) and get a real picture of what they've actually done, beyond what the phone screen could tell you. Run in order &mdash; don't skip ahead.</p></div>
    ${stepsHtml}
  </div>
  <div class="content-block">
    <div class="block-label">Part B &mdash; Spring the Cold-Call Test</div>
    <div class="block-body"><p>Partway through, shift without much warning:</p></div>
    <div class="formula">"Look, what I like to do is just get people doing a couple of cold calls, just to see how you go."</div>
    <div class="block-body"><p>Then have them make a couple of real cold calls on the spot &mdash; e.g. to Australian prospects &mdash; with no script and no prep time.</p></div>
    <div class="callout warn"><span class="tag">Training note</span>This is deliberately uncoached. Do they freeze, or find something to say? Do they recover after a bad response, or spiral? Are they actually listening to the person on the other end, or running a mental monologue? This is the single best raw signal you get before investing a week of their time and yours in the script.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Decision</div>
    <div class="step-row"><div class="step-num">&#10003;</div><div class="step-body"><strong>Happy with what you saw</strong> &mdash; move to the reference check (Stage 3)</div></div>
    <div class="step-row"><div class="step-num">&#10005;</div><div class="step-body"><strong>Not there yet</strong> &mdash; end here; they were never given any internal material, so nothing needs to be walked back</div></div>
  </div>
  `;
}

function hiringStage3TabSales(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">Straight after the interview, if you're happy: hand over the Client Call Script on the spot and set a date one week out for the Test Project. Run the reference check the same day &mdash; the two run in parallel, not one after the other.</span></div>
  <div class="content-block">
    <div class="block-label">Suggested Memorisation Method (For the Candidate's Week)</div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body">Print two copies of the script.</div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body">Read the full script out loud.</div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body">Black out one word with a marker.</div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body">Say the script again &mdash; if they stuff up the blacked-out word, look at the clean copy and restart.</div></div>
    <div class="step-row"><div class="step-num">5</div><div class="step-body">When they get it right, black out the next word. Repeat until every word is blacked out.</div></div>
    <div class="callout"><span class="tag">Training note</span>A 400-word script means they say it 400 times. By the end they don't think about the words &mdash; they just say them. This is what allows natural delivery, real listening, and confident tone.</div>
    <div class="callout warn"><span class="tag">Do NOT hand over the objection-handling sheet at this stage</span>That stays back until after the Test Project &mdash; holding it back is what makes the Test Project a real test rather than a memory test.</div>
  </div>
  <div class="content-block">
    <div class="block-label">The Reference Check</div>
    <div class="block-body"><p>The same day (or as soon as possible after), run the reference check independently. Call their most recent sales manager directly, not a HR reference line:</p><ul>
      <li>Did they generate their own pipeline, or only work leads that were handed to them?</li>
      <li>How did they handle real pushback from a customer under pressure &mdash; an actual example, not a general impression?</li>
      <li>Would you hire them again? Why or why not?</li>
      <li>Is there a pattern in why they left &mdash; theirs or the employer's story, and do the two match?</li>
    </ul></div>
  </div>
  <div class="content-block">
    <div class="block-label">Early Exit Rule</div>
    <div class="callout warn"><span class="tag">If anything comes back bad at any point during that week</span>Call the candidate straight away &mdash; "Hey, look, we've decided to go with someone else" &mdash; rather than waiting for the Test Project. No point letting them spend the rest of the week learning a script for a role they're not getting.</div>
  </div>
  `;
}

function hiringStage4TabSales(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">One week later: a recorded Teams call, with Les or one of your staff playing the client. The main pass/fail decision point in the whole process &mdash; then the PRIOS Personality Benchmark as the final selection gate before a job offer.</span></div>
  <div class="content-block">
    <div class="block-label">Part 1 &mdash; Test Project: Recorded Call</div>
    <div class="block-body"><p><strong>Opening line</strong> (say this once, before you start):</p></div>
    <div class="formula">"Cool, thanks for jumping on. I'm going to play a client who's short on tradies, you run your pitch like a real call. I'll throw some pushback, that's normal. I'm not looking for perfect &mdash; I'm looking at how you move when things don't go exactly to plan. Ready?"</div>
  </div>
  <div class="content-block">
    <div class="block-label">Beat 1 &mdash; Vague Opener</div>
    <div class="formula">"Yeah look, it's been a bit of a nightmare mate, we're short-staffed."</div>
    <div class="block-body"><p>Training note: do they dig (ask 'in what way', 'how long', 'what have you tried') or jump straight into pitching? Jumping straight to the pitch is a red flag &mdash; they'll skip discovery on real calls too.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Beat 2 &mdash; One More Vague Answer, Then Force the Cut</div>
    <div class="formula">"Yeah we've tried Seek, tried a few agencies, nothing's really landed." &mdash; then after 2&ndash;3 exchanges max, cut in: "So what can you actually do for me?"</div>
    <div class="block-body"><p>Training note: can they pivot into the pitch on a shorter runway than the script implies, and do they hold the pause after the outcome line instead of filling the silence?</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Beat 3 &mdash; Cold Price Pushback (Not in the Script They Were Sent)</div>
    <div class="formula">"$17K feels pretty steep for a recruiter, mate."</div>
    <div class="callout warn"><span class="tag">Testing &mdash; the single highest-signal moment in the whole test</span>Do they hold the price and explain value, or immediately cave, discount, or over-justify?</div>
  </div>
  <div class="content-block">
    <div class="block-label">Beat 4 &mdash; Risk and Stall, Stacked On Top</div>
    <div class="formula">"What if this guy doesn't even work out? ... Yeah... nah, that's a fair bit to think about, I might need to talk to my business partner."</div>
    <div class="block-body"><p>Training note: can they handle more than one objection in the same call without losing frame? This tells you whether Beat 3 was a fluke or a real skill.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Beat 5 &mdash; Neutral, Non-Committal Response, Then Go Quiet</div>
    <div class="block-body"><p>(Say nothing further. Let them fill the silence.)</p></div>
    <div class="callout warn"><span class="tag">Testing &mdash; the strongest signal in the whole test</span>Do they sit and wait for permission, backpedal into re-justifying, or self-advance into the logical next step in their own words (Terms of Business, job description) without being asked? Self-advancing unprompted is the strongest signal in the whole test.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Beat 6 &mdash; End It, Give Feedback Out Loud, On the Spot</div>
    <div class="formula">"Alright, that's the roleplay. Here's what I saw &mdash; [one strength], [one thing to work on]. That's it, we'll be in touch."</div>
    <div class="block-body"><p>Training note: how they take feedback &mdash; defensive, blank, or 'got it, noted.' A rough performance with a coachable reaction beats a smooth performance with a defensive one.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Score It</div>
    <table class="data-table">
      <thead><tr><th>What to Score</th><th>Look For</th></tr></thead>
      <tbody>
        <tr><td><strong>Discovery instinct</strong></td><td>Did they dig before pitching, or pitch blind?</td></tr>
        <tr><td><strong>Pause discipline</strong></td><td>Did they let silence sit after the outcome line, or rush to fill it?</td></tr>
        <tr><td><strong>Price nerve</strong></td><td>Did they hold the price, or cave/discount/over-justify?</td></tr>
        <tr><td><strong>Self-advance</strong></td><td>Did they move to next steps unprompted, or wait to be told?</td></tr>
      </tbody>
    </table>
    <div class="block-body" style="margin-top:8px"><p><strong>Rule:</strong> solid on at least 3 of the 4 &rarr; move to Part 2, PRIOS. Weak on all four &rarr; no hire.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Part 2 &mdash; PRIOS Personality Benchmark (Final Selection Gate)</div>
    <div class="block-body"><p>Once a candidate has cleared the Test Project, the final stage before a job offer is the PRIOS Principles Assessment &mdash; checked against Les's own result (completed 1 September 2026) as the target profile: <strong>"The Commander"</strong> &mdash; driven and demanding, pragmatic and results-oriented, comfortable taking charge, leads through setting and applying high standards rather than emotional connection. A Sales Closer needs to hold their ground on price, push back on objections, and drive a conversation toward a decision without needing to be liked &mdash; that's the Commander profile, almost trait for trait.</p></div>
  </div>
  <div class="content-block">
    <div class="block-label">Highest-Weight Traits &mdash; What Actually Predicts Sales Performance</div>
    <div class="block-body"><p>The 17 PRIOS traits are pre-weighted toward what typically predicts sales performance for this role &mdash; the four below carry the most weight; traits like Humorous or Conceptual barely count.</p></div>
    <table class="data-table">
      <thead><tr><th>Trait</th><th>Les's Score</th><th>Why It Matters Here</th></tr></thead>
      <tbody>
        <tr><td><strong>Determined</strong></td><td>89% Very High</td><td>Persistence through rejection and a rough patch &mdash; the core of surviving a low-base/high-commission role</td></tr>
        <tr><td><strong>Tough</strong></td><td>94% Very High</td><td>Willing to fight for price, tell people what they really think, take critical feedback without flinching</td></tr>
        <tr><td><strong>Extraverted</strong></td><td>79% High</td><td>Engaging and outgoing &mdash; thrives running conversation after conversation, cold</td></tr>
        <tr><td><strong>Leadership</strong></td><td>94% Very High</td><td>Drives the conversation, holds the client to a decision, doesn't wait to be led</td></tr>
      </tbody>
    </table>
    <div class="callout"><span class="tag">Caveat</span>Les scored low on Composed (26%) and Humble (7%) &mdash; his own acknowledged growth areas, not requirements for a hire. A candidate scoring higher than Les on either should be read as a plus, not a mismatch.</div>
  </div>
  <div class="content-block">
    <div class="block-label">How to Read the Result</div>
    <div class="block-body"><p><strong>Strong match:</strong> a candidate doesn't need to mirror Les trait-for-trait. High on the four traits above is the real signal &mdash; low scores on Humorous or Conceptual are irrelevant, exactly as they are for Les.</p>
    <p style="margin-top:8px"><strong>Weak match:</strong> low scores on Determined, Tough, or Leadership &mdash; or a profile leaning toward Peacekeeper/Helper archetypes rather than Commander/Shaper/Orchestrator &mdash; is a real flag for this role. It doesn't automatically mean decline; weigh it against the Test Project and interview rather than either signal alone.</p></div>
    <div class="callout warn"><span class="tag">Important</span>PRIOS measures style and thinking tendencies, not skill or track record. It's a final cross-check on temperament, not the deciding vote &mdash; never a stand-alone hire/no-hire decision on its own.</div>
  </div>
  <div class="content-block">
    <div class="block-label">Final Decision &mdash; Stage 4</div>
    <table class="data-table">
      <thead><tr><th>Outcome</th><th>Result</th></tr></thead>
      <tbody>
        <tr><td>Test Project weak on all 4 scoring criteria</td><td>No hire &mdash; do not proceed to PRIOS</td></tr>
        <tr><td>Test Project solid on 3+ of 4</td><td>Proceed to PRIOS Personality Benchmark</td></tr>
        <tr><td>PRIOS &mdash; strong or acceptable match on highest-weighted traits</td><td>Extend job offer with 4-week paid trial (Stage 5)</td></tr>
        <tr><td>PRIOS &mdash; weak match</td><td>Discuss with Les before proceeding &mdash; not an automatic decline</td></tr>
      </tbody>
    </table>
  </div>
  `;
}

function hiringStage5TabSales(){
  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">The job offer, the 4-week paid trial, and what happens next for the candidate once they're confirmed.</span></div>
  <div class="content-block">
    <div class="block-label">Job Offer &mdash; With a 4-Week Paid Trial</div>
    <div class="block-body"><p>If the PRIOS gate confirms them: extend the offer. It's paid, real employment, structured with a 4-week trial period from day one &mdash; not a separate unpaid or informal arrangement beforehand.</p></div>
    <div class="callout warn"><span class="tag">Get it in writing first</span>Make sure the trial period is agreed to in writing before their first day; that's what makes it a valid trial period rather than just an early performance review.</div>

    <div class="block-label">The Trial &mdash; Weeks 1 to 4</div>

    <table class="data-table">
      <thead><tr><th>Milestone</th><th>What It Tests</th></tr></thead>
      <tbody>
        <tr><td><strong>1. Recaps</strong></td><td>Can take a prospect's stated pain and label it accurately into the right problem category. Tests listening and abstraction.</td></tr>
        <tr><td><strong>2. Close &amp; objections</strong></td><td>Can ask for the decision and handle real objections without breaking frame.</td></tr>

    </table>
    <table class="data-table" style="margin-top:10px">
      <thead><tr><th>Trigger</th><th>Result</th></tr></thead>

        <tr><td>Milestone 1 (Recaps) passed</td><td>More leads added, still low-value</td></tr>
        <tr><td>Milestone 2 (Close &amp; objections) passed</td><td>Standard lead flow, though still monitored closely</td></tr>

    <div class="block-label">Closer Career Progression &amp; Commission Tiers</div>

        <tr><td>Intermediate Closer 1</td><td>$26&ndash;29/hr</td><td>$200/TOB</td><td>Sustain 20%+ close rate over a rolling 4 weeks</td></tr>
        <tr><td>Intermediate Closer 2</td><td>+$2/hr</td><td>$300/TOB</td><td>Sustain 30%+ close rate over a rolling 4 weeks</td></tr>

    <div class="callout warn"><span class="tag">Confirm figures before use</span>These numbers ($200 / $300 / $400, and the 20% / 30% / 40% thresholds) are a starting structure, not fixed for good &mdash; revisit once you have a few reps' worth of real data. The exact Bonus Boost amount (extra pay above the 40% baseline for a Senior Closer) is still open &mdash; pick a number once the base tiers have run for a while.</div>

function hiringTemplatesTabSales(mid){

      body:"Hi [Candidate Name],\n\nHope you're doing well.\n\nThis is to confirm your interview for the Sales Consultant role at Stand Up Recruitment.\n\nDate: [Date]\nTime: [Time]\nVenue: 41 Taharoto Road, Takapuna, Auckland 0622\n\nPlease arrive 5 minutes early and let us know if you need to make any changes.\n\nLooking forward to meeting you.\n\nThanks\n[Signature]"},
    {id:"script-handover", label:"Email &mdash; Script Handover &amp; Test Project Date", subject:"Next Step &mdash; Sales Consultant Role &mdash; Stand Up Recruitment",
      body:"Hi [Candidate Name],\n\nGreat to meet you — thanks for the conversation and for jumping on those cold calls with us.\n\nAttached is the Client Call Script. Please learn this thoroughly over the coming week — we'll be running a recorded live call together on:\n\nDate: [Date, one week out]\nTime: [Time]\n\nNo need to overthink it — just know it cold by the day.\n\nThanks\n[Signature]"},
    {id:"prios-invite", label:"Email &mdash; PRIOS Assessment Invite", subject:"Final Step &mdash; Personality Assessment &mdash; Stand Up Recruitment",

    {id:"rejected", label:"Email &mdash; Rejected / Process Update", subject:"Update on Your Application &mdash; Stand Up Recruitment",

  return `
  <div class="topic-banner"><span class="topic-tag">Topic</span><span class="topic-text">Every candidate-facing touchpoint in the process, ready to copy and personalise. Keep the tone consistent &mdash; polite, direct, and warm without overselling.</span></div>
  <div class="content-block">

        <tr><td>Interview + cold-call test passed &mdash; script handed over</td><td>Email</td><td>Script Handover &amp; Test Project Date</td></tr>
        <tr><td>Reference check comes back bad mid-week</td><td>Phone call</td><td>Immediate call &mdash; no email template, see Stage 3</td></tr>
        <tr><td>Test Project passed &mdash; PRIOS Assessment sent</td><td>Email</td><td>PRIOS Assessment Invite</td></tr>
        <tr><td>Not proceeding after interview or test project</td><td>Email</td><td>Rejected &mdash; Process Update</td></tr>

    <div class="block-label">Appendix A &mdash; Cold Call Script (Full Reference)</div>
    <div class="block-body"><p>Hand this to the candidate only at the point marked in Stage 2 (Live Cold-Call Test) &mdash; not before.</p></div>
    <div class="step-row"><div class="step-num">1</div><div class="step-body"><strong>Pattern Interrupt + Familiarity</strong> &mdash; say their name like you know them.<div class="formula" style="margin-top:6px">"Bob!" (Pause &mdash; let their brain catch up.) "Les here."</div></div></div>
    <div class="step-row"><div class="step-num">2</div><div class="step-body"><strong>Take Away Their Time Objection First</strong><div class="formula" style="margin-top:6px">"Mate, I've only got about 20 seconds before I jump into another meeting, so I'll keep this sharp."</div></div></div>
    <div class="step-row"><div class="step-num">3</div><div class="step-body"><strong>Take Away Their 'Send Me Info' Objection</strong> &mdash; don't pitch yet.<div class="formula" style="margin-top:6px">"Before I flick you some info…"</div></div></div>
    <div class="step-row"><div class="step-num">4</div><div class="step-body"><strong>Take Away Their 'Not Interested' Objection</strong> &mdash; ask for help, don't pitch.<div class="formula" style="margin-top:6px">"…I've got two quick questions I need your help with around your [trade]. Then I'll get out of your hair."</div></div></div>
    <div class="step-row"><div class="step-num">5</div><div class="step-body"><strong>Question 1 &mdash; Diagnose Their Pain</strong> &mdash; make them speak the problem out loud.<div class="formula" style="margin-top:6px">"How are you finding good [trade] right now? Actually getting them on the tools &mdash; is that currently easy, or a bit of a nightmare?"</div></div></div>
    <div class="step-row"><div class="step-num">6</div><div class="step-body"><strong>Question 2 &mdash; Quantify the Consequence</strong> &mdash; show the cost without saying it yourself.<div class="formula" style="margin-top:6px">"And if you had the right guy starting next week &mdash; full-time, work-ready &mdash; what job or project would that let you attack properly?"</div></div></div>
    <div class="step-row"><div class="step-num">7</div><div class="step-body"><strong>Deliver the Value in ONE Line</strong> &mdash; simple, direct, no hype.<div class="formula" style="margin-top:6px">"I help Aussie companies solve that exact problem by tapping into a pool of ready-to-move Kiwi tradies that 99% of your competitors don't even know exist." (Pause. Let it land.)</div></div></div>
    <div class="step-row"><div class="step-num">8</div><div class="step-body"><strong>Micro-CTA (No Hard Ask)</strong><div class="formula" style="margin-top:6px">"I can send you 2-3 CVs to show you what the talent looks like. What roles are you actually desperate for right now?"</div></div></div>
    <div class="step-row"><div class="step-num">9</div><div class="step-body"><strong>Book the Call Without Begging</strong> &mdash; lead it, don't ask permission.<div class="formula" style="margin-top:6px">"Sweet &mdash; easiest way to do this is a quick 10-minute Teams chat so I know exactly who you need. Does Tuesday afternoon or Wednesday morning work?"</div></div></div>
    <div class="step-row"><div class="step-num">10</div><div class="step-body"><strong>If They Push Back</strong> &mdash; Hormozi-style objection system.</div></div>
    <table class="data-table" style="margin-top:6px">
      <thead><tr><th>Objection</th><th>Response</th></tr></thead>
      <tbody>
        <tr><td><strong>Price</strong></td><td>"Fair — and honestly, staying short-staffed is costing you way more than any recruiter invoice. How long would it take you to get ROI on one good sparkie? A month?"</td></tr>
        <tr><td><strong>Stall</strong></td><td>"Totally. What would happen if they said no?" (Flush the real objection.)</td></tr>
        <tr><td><strong>Vehicle</strong></td><td>"100%. Plenty of good businesses have been burned by recruiters. If I landed you the exact guy you've been chasing, would that solve the problem or is there something deeper behind the hesitation?"</td></tr>
      </tbody>
    </table>
    <div class="callout"><span class="tag">Companion document</span>The Objection Handling Script + Training Notes (the Defuse-Align-Future-Pace-Isolate-Reframe framework) is held back until after the Test Project &mdash; see Stage 3. It's a separate companion document, not reproduced here.</div>
  </div>
  `;
}

function switchTab(mid, tabName){
  const panels = document.querySelectorAll('[id^="panel-' + mid + '-"]');
  const btns = document.querySelectorAll('[id^="tbtn-' + mid + '-"]');
  panels.forEach(p => p.classList.remove('active'));
  btns.forEach(b => b.classList.remove('active'));
  const panel = document.getElementById('panel-' + mid + '-' + tabName);
  const btn = document.getElementById('tbtn-' + mid + '-' + tabName);
  if(panel) panel.classList.add('active');
  if(btn) btn.classList.add('active');
}

function copyTemplate(id){
  const el = document.getElementById('tmpl-' + id);
  if(!el) return;
  const text = el.innerText;
  const btn = document.getElementById('copy-' + id);
  function done(){ if(btn){ btn.textContent = 'Copied!'; setTimeout(()=>{ btn.textContent = 'Copy'; }, 2000); } }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else {
    fallbackCopy(text,done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  done();
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') !== 'light';
  if (isDark) {
    html.setAttribute('data-theme', 'light');
    document.getElementById('toggle-icon').textContent = '🌙';
    document.getElementById('toggle-label').textContent = 'Dark';
    localStorage.setItem('playbook-theme', 'light');
  } else {
    html.removeAttribute('data-theme');
    document.getElementById('toggle-icon').textContent = '☀️';
    document.getElementById('toggle-label').textContent = 'Light';
    localStorage.setItem('playbook-theme', 'dark');
  }
}

(function() {
  const saved = localStorage.getItem('playbook-theme');
  if (saved === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.addEventListener('DOMContentLoaded', function() {
      const icon = document.getElementById('toggle-icon');
      const label = document.getElementById('toggle-label');
      if (icon) icon.textContent = '🌙';
      if (label) label.textContent = 'Dark';
    });
  }
})();
