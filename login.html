<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stand Up Recruitment — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --surface:#111111;
    --surface2:#181818;
    --surface3:#1f1f1f;
    --text:#f2ede5;
    --text2:#c8c4bc;
    --border:#2a2a2a;
    --accent:#c8f04a;
    --error:#f04a4a;
  }
  html.light{
    --bg:#f4f2ee;
    --surface:#ffffff;
    --surface2:#edeae5;
    --surface3:#e5e2dc;
    --text:#18160f;
    --text2:#4a4641;
    --border:#ddd9d0;
    --accent:#4a6600;
    --error:#b32a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Syne',sans-serif;
    transition:background .2s ease, color .2s ease;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 32px;
  }
  .eyebrow{
    font-family:'DM Mono',monospace;
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }
  h1{
    font-family:'DM Serif Display',serif;
    font-weight:400;
    font-size:32px;
    line-height:1.1;
    margin:0 0 24px;
  }
  label{
    display:block;
    font-family:'DM Mono',monospace;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text2);
    margin:0 0 6px;
  }
  input{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'Syne',sans-serif;
    font-size:15px;
    padding:11px 12px;
    margin-bottom:18px;
    transition:border-color .15s ease;
  }
  input:focus{
    outline:none;
    border-color:var(--accent);
  }
  button{
    width:100%;
    background:var(--accent);
    color:#0a0a0a;
    border:none;
    border-radius:999px;
    font-family:'DM Mono',monospace;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:500;
    padding:13px 18px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  button:hover{opacity:.85;}
  .error{
    display:none;
    color:var(--error);
    font-family:'DM Mono',monospace;
    font-size:12.5px;
    margin:-6px 0 16px;
  }
  .error.show{display:block;}
  footer{
    margin-top:24px;
    text-align:center;
    color:var(--text2);
    font-family:'DM Mono',monospace;
    font-size:11px;
    letter-spacing:.03em;
  }
</style>
</head>
<body>
<div class="card">
  <p class="eyebrow">Stand Up Recruitment</p>
  <h1>Playbook Hub Login</h1>
  <form id="loginForm">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <p class="error" id="loginError">Incorrect username or password.</p>
    <button type="submit">Log in</button>
  </form>
  <footer>Internal use only — Stand Up Recruitment</footer>
</div>

<script>
(function(){
  var root = document.documentElement;
  var stored = localStorage.getItem('playbook-hub-theme');
  var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  if((stored || (prefersLight ? 'light' : 'dark')) === 'light'){
    root.classList.add('light');
  }
})();

(function(){
  var CREDENTIALS = {
    marketing: 'marketing123',
    accounts:  'accounts123',
    recruiter: 'recruiter123',
    support:   'support123'
  };

  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('loginError');
  var passwordField = document.getElementById('password');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var username = document.getElementById('username').value.trim().toLowerCase();
    var password = passwordField.value;

    if(CREDENTIALS[username] === password){
      sessionStorage.setItem('playbook-auth', username);
      window.location.href = 'index.html';
    } else {
      errorEl.classList.add('show');
      passwordField.value = '';
      passwordField.focus();
    }
  });
})();
</script>
</body>
</html>
